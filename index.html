<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TRINKET LAB // every web tool, one tab</title>
<meta name="description" content="TRINKET LAB — 30+ browser-only tools: text, image, colour, JSON, regex, hashes, encoders, QR codes, converters, timers, notes and more. No uploads, no accounts, works offline." />
<meta name="theme-color" content="#04060d" />
<meta property="og:title" content="TRINKET LAB" />
<meta property="og:description" content="Every small web tool you need, running entirely in your browser." />
<meta property="og:type" content="website" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬢</text></svg>" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="stylesheet" href="styles.css" />
<script>
  // apply saved theme before first paint to avoid a flash
  try {
    var s = JSON.parse(localStorage.getItem("trinket:settings") || "{}");
    var root = document.documentElement;
    if (s.theme) root.dataset.theme = s.theme;
    if (s.fx === false) root.dataset.fx = "off";
    if (s.glow === false) root.dataset.glow = "off";
    if (s.motion === false) root.dataset.motion = "off";
    if (s.density) root.dataset.density = s.density;
  } catch (e) {}
</script>
</head>
<body>
<div class="bg-grid" aria-hidden="true"></div>
<div class="bg-orb orb-a" aria-hidden="true"></div>
<div class="bg-orb orb-b" aria-hidden="true"></div>
<div class="scanlines" aria-hidden="true"></div>

<header class="site-head">
  <div class="brand">
    <button class="icon-btn" id="rail-toggle" title="Toggle sidebar (⌘B)" aria-label="Toggle sidebar">☰</button>
    <button class="brand-mark" id="brand-home" title="Home" aria-label="Home">⬢</button>
    <div class="brand-text">
      <h1>TRINKET<span>LAB</span></h1>
      <p class="tagline">every tool · zero uploads · runs in your tab</p>
    </div>
  </div>
  <div class="head-tools">
    <button class="search-btn" id="open-palette" type="button">
      <span>⌕</span><span class="grow">search tools…</span><span class="kbd">⌘K</span>
    </button>
    <span class="clock" id="clock" title="Local time">--:--:--</span>
    <button class="icon-btn" id="btn-theme" title="Cycle theme (⌘⇧T)" aria-label="Theme">◐</button>
    <button class="icon-btn" id="btn-fullscreen" title="Fullscreen (F11)" aria-label="Fullscreen">⛶</button>
    <button class="icon-btn" id="btn-help" title="Keyboard shortcuts (?)" aria-label="Help">?</button>
    <button class="icon-btn" id="btn-settings" title="Settings" aria-label="Settings">⚙</button>
  </div>
</header>

<div class="shell" id="shell">
  <aside class="rail" id="rail" aria-label="Tools">
    <input class="rail-filter" id="rail-filter" type="search" placeholder="filter tools…" autocomplete="off" spellcheck="false" />
    <nav class="rail-list" id="rail-list"></nav>
    <div class="rail-foot" id="rail-foot"></div>
  </aside>
  <main class="view" id="view"></main>
</div>

<footer class="site-foot">
  <span>Everything runs client-side — no server, no upload, no accounts.</span>
  <span class="foot-sep">/</span>
  <a href="https://github.com/rueyday/WebLab" target="_blank" rel="noopener">source</a>
  <span class="foot-sep">/</span>
  <a href="privacy.html">privacy</a>
  <span class="foot-sep">/</span>
  <span id="foot-version">v2</span>
  <span class="spacer"></span>
  <span id="foot-offline" class="chip" hidden>offline ready</span>
</footer>

<div id="palette-host" hidden></div>
<div id="modal-host" hidden></div>
<div class="toast-stack" id="toast-stack" aria-live="polite"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
